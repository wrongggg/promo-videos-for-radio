<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radio Promo Video Generator — Sign in</title>
<style>
    :root {
        --bg: #f5f5f7;
        --glass: rgba(255,255,255,0.6);
        --border: rgba(0,0,0,0.09);
        --text: #1c1c1e;
        --text-muted: rgba(28,28,30,0.55);
    }
    * { box-sizing: border-box; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
        background: var(--bg); color: var(--text); margin: 0; min-height: 100vh;
        display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .panel {
        background: var(--glass); backdrop-filter: blur(18px) saturate(140%);
        -webkit-backdrop-filter: blur(18px) saturate(140%);
        border: 1px solid var(--border); border-radius: 24px; padding: 36px;
        width: 100%; max-width: 360px; text-align: center;
    }
    h1 { font-size: 20px; font-weight: 700; margin: 0 0 4px; }
    .subtitle { color: var(--text-muted); margin: 0 0 28px; font-size: 13px; }
    .error { color: #ff6b6b; font-size: 13px; margin-bottom: 18px; }
    .google-btn {
        display: flex; align-items: center; justify-content: center; gap: 10px;
        width: 100%; background: #fff; color: #1f1f1f; padding: 12px 16px;
        border: 1px solid rgba(0,0,0,0.14); border-radius: 12px; font-weight: 600;
        font-size: 14px; text-decoration: none;
    }
    .google-btn:hover { background: #f5f5f5; }
</style>
</head>
<body>
<div class="panel">
    <h1>Radio Promo Video Generator</h1>
    <p class="subtitle">Sign in to generate a video.</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <a class="google-btn" href="{{ url_for('auth_google', next=next) }}">
        <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.97H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.03l2.99-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.97l2.99 2.33C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
        Sign in with Google
    </a>
</div>
</body>
</html>
